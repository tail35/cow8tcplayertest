      /**
       * 初始化播放器
       */
      var myPlayer = null
      function createPlayer() {
        //...设置点播必备启动参数
        createParm()
        //...创建点播配置文件
        live_conf = GetLiveConf()
        //   console.log('li.conf', JSON.stringify(live_conf))
        //...创建并初始化播放器
        myPlayer = new wmPlayer(live_conf)
        eventEmit()
      }
      window.onload = function () {
        if (isMoblie()) {
          document.getElementById('idWrapper').style.width = '100%'
          document.getElementById('idWrapper').style.height = `${(window.screen.availWidth*9/16)}px`
          document.body.setAttribute('class', 't_mobile')
        }
        window._tx_webrtc_enable = true
        createPlayer()
      }

      function eventEmit() {
        var wmPlayerEvents = Object.keys(myPlayer.wmPlayerEvents)
        wmPlayerEvents.forEach(function (item) {
          if (
                  window.myPlayer.wmPlayerEvents[item] ==
                  window.myPlayer.wmPlayerEvents.PLAYER_TIME_UPDATE
          ) {
            return
          }
          window.myPlayer.on(
                  window.myPlayer.wmPlayerEvents[item],
                  function (value) {
                    console.log('li.live.' + item, value)
                    if(value.type == 'onpagereload'){
                      // prompt()
                      window.location.reload();
                      // alert(value.detail)
                    }

                    if(value.type == 'onadclick'){
                      console.error('点击广告弹窗，通知业务处理:'+ value.detail.type)
                     }
                  }
          )
        })
      }
        //模拟广告弹窗
      function setAdPopUpParameter(){
        window.myPlayer.setAdPopUpParameter('http://wmdemo.cow8.cn/demo2.jpg', 'type click')
      }

      function one5speed() {
        if (!myPlayer) {
          return
        }
        myPlayer.setPlayRate(1.5)
      }
      function one75speed() {
        if (null == myPlayer) {
          return
        }
        myPlayer.setPlayRate(1.75)
      }
      function one2speed() {
        if (null == myPlayer) {
          return
        }
        myPlayer.setPlayRate(2)
        console.log('22')
      }

        myPlayer.setPlayRate(1.0)

      function tofront() {
        console.log('111---进入 --- tofront')
        myPlayer.tofront()
        //模拟业务调用暂停
        myPlayer.pause()
      }

      function tobackend() {
        console.log('111---进入 --- tobackend')
        myPlayer.tobackend()
      }

      function addvolume() {
        //volume 设置参数，则是设置音量。
        //不设置参数，则是返回音量。
        var value = myPlayer.volume()
        if (1.0 == value || value + 0.2 > 1.0) {
          value = 1.0
        } else {
          value += 0.2
        }
        myPlayer.volume(value)
        myPlayer.reportMsgLog('音量增加到' + value);
      
      }

      function delvolume() {
        var value = myPlayer.volume()
        if (value <= 0.0 || value - 0.2 <= 0.0) {
          value = 0.0
        } else {
          value -= 0.2
        }
        value=0
        console.log('value111:', value)
        myPlayer.volume(value)
      }
      function getvolume(){
        console.log('value111:',  myPlayer.volume())
      }
      function quitcallback(res) {}
      function invokequit() {
        myPlayer.reportQuit(quitcallback)

      function replay() {
        if (!myPlayer) return
        myPlayer.replay()
      }
      function switchws() {
        var str = { line: 'WANGSU', defined: 'h' }
        myPlayer.switchline('WANGSU', 'h')
      }
      function switchwsflv() {
        // var str={line:"WANGSU",defined:"h"};
        // myPlayer.switch(str);
        myPlayer.switchline('WANGSU_HLS', 'h')
      }
      function switchtr() {
        // var str = { line: 'WANGSU', defined: 'h' }
        //   myPlayer.switch(str)
        myPlayer.switchline('TENCENT_CLOUD', 'h')
      }
      function switchtrflv() {
        // var str={line:"WANGSU",defined:"h"};
        // myPlayer.switch(str);
        myPlayer.switchline('TENCENT_CLOUD_HLS', 'h')
      }
      function switchali() {
        myPlayer.switchline('ALIYUN', 'h')
      }
      function switchaliflv() {
        myPlayer.switchline('ALIYUN_HLS', 'h')
      }
      function seek60() {
        myPlayer.currentTime(60) //only for vod.
      }
      function isMoblie() {
        var sUserAgent = navigator.userAgent.toLowerCase()
        if (
          /ipad|iphone|midp|rv:1.2.3.4|ucweb|android|windows ce|windows mobile/.test(
            sUserAgent
          )
        ) {
          return true
        } else {
          return false
        }
      }

      function intervaltime() {
        if ('false' == liveType) {
          if (null != myPlayer) {
            console.log('crtm:', myPlayer.currentTime())
          }
        }
      }
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
          if (myPlayer) {
            console.log('switch tobackend')
            myPlayer.tobackend()
          }
        } else {
          setTimeout(function () {
            if (myPlayer) {
                 console.log('switch tofront')
                 myPlayer.tofront()
                 //模拟业务调用暂停
                // myPlayer.pause()
            }
          }, 1000)
        }
      })

      var userAgent = navigator.userAgent, // userAgent
        rMsie = /.*(msie) ([\w.]+).*/, // ie
        rFirefox = /.*(firefox)\/([\w.]+).*/, // firefox
        rOpera = /(opera).+version\/([\w.]+)/, // opera
        rChrome = /.*(chrome)\/([\w.]+).*/, // chrome
        rSafari = /.*version\/([\w.]+).*(safari).*/ // safari

      var jMeteor = {}
      jMeteor.browser = {}
      window.jMeteor = jMeteor
      var ua = userAgent.toLowerCase()
      function uaMatch(ua) {
        var match = rMsie.exec(ua)
        if (match != null) {
          return { browser: match[1] || '', version: match[2] || '0' }
        }
        var match = rFirefox.exec(ua)
        if (match != null) {
          return { browser: match[1] || '', version: match[2] || '0' }
        }
        var match = rOpera.exec(ua)
        if (match != null) {
          return { browser: match[1] || '', version: match[2] || '0' }
        }
        var match = rChrome.exec(ua)
        if (match != null) {
          return { browser: match[1] || '', version: match[2] || '0' }
        }
        var match = rSafari.exec(ua)
        if (match != null) {
          return { browser: match[2] || '', version: match[1] || '0' }
          if (match != null) {
            return { browser: '', version: '0' }
          }
        }
      }
    </script>
